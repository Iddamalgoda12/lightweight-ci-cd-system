spring:
  application:
    name: lightweight-ci-cd
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lightweight_cicd}
    username: ${DATABASE_USERNAME:lightweight_cicd}
    password: ${DATABASE_PASSWORD:lightweight_cicd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
