services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lightweight_cicd
      POSTGRES_USER: lightweight_cicd
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightweight_cicd -d lightweight_cicd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
